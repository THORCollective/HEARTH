name: Hunt Prompt-Injection Check

# Hunt text is served to users' AI tools by the HEARTH MCP server. This flags
# changed hunts that hide characters or address an AI assistant, and fails
# until a maintainer reviews them and adds the `injection-reviewed` label.
#
# Runs on every PR (no path filter) so it can be a required status check; it
# no-ops when no hunt files changed. Re-runs when labels change.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Check changed hunts for prompt-injection text
        env:
          BASE: ${{ github.base_ref }}
          # A label added before the latest push doesn't approve the new
          # commits: on `synchronize` the maintainer must re-add it.
          INJECTION_REVIEWED: ${{ github.event.action != 'synchronize' && contains(github.event.pull_request.labels.*.name, 'injection-reviewed') }}
        run: |
          git fetch --no-tags origin "$BASE"
          export BASE_REF="origin/$BASE"
          # Use the base branch's copy of the check so a PR can't weaken the
          # check that judges it. Falls back to the PR's copy only until the
          # script first lands on the base branch.
          if git show "$BASE_REF:scripts/check_hunt_injection.py" > "$RUNNER_TEMP/check.py" 2>/dev/null; then
            echo "Using $BASE_REF copy of the check"
          else
            cp scripts/check_hunt_injection.py "$RUNNER_TEMP/check.py"
            echo "::warning::Check not on $BASE_REF yet; using this PR's copy"
          fi
          python -I "$RUNNER_TEMP/check.py"
