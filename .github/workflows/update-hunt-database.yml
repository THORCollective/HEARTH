name: Update Hunt Database

on:
  push:
    branches:
      - main
    paths:
      - 'Flames/**/*.md'
      - 'Embers/**/*.md'
      - 'Alchemy/**/*.md'
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: update-hunt-database
  cancel-in-progress: false

jobs:
  update-database:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git dates

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Rebuild hunt database and push
        run: |
          git config user.name "hearthbot"
          git config user.email "hearthbot@users.noreply.github.com"
          # database/hunts.db is a DERIVED binary. On a push race it must be rebuilt
          # on the new tip, never rebased — git cannot three-way-merge a SQLite file,
          # so a rebase of the generated commit fails outright. Same failure mode and
          # same fix as .github/workflows/update-hunts.yml, which lost this race on
          # 2026-09-21 and silently left a stale index on main.
          for attempt in 1 2 3; do
            python scripts/build_hunt_database.py

            if git diff --quiet database/hunts.db; then
              echo "Database already matches the hunt sources — nothing to commit."
              exit 0
            fi

            git add database/hunts.db
            git commit -m "chore: update hunt database

            - Updated from hunt files in Flames/, Embers/, Alchemy/
            - Database contains $(sqlite3 database/hunts.db 'SELECT COUNT(*) FROM hunts') hunts
            - Auto-generated by update-hunt-database workflow"

            if git push; then
              echo "Pushed rebuilt database on attempt $attempt."
              exit 0
            fi

            echo "Push failed (attempt $attempt): main moved. Discarding this build and rebuilding on the new tip."
            git fetch origin main
            git reset --hard FETCH_HEAD
            sleep 2
          done
          echo "::error::Failed to push hunt database after 3 attempts"
          exit 1

      - name: Database statistics
        run: |
          echo "📊 Database Statistics:"
          sqlite3 database/hunts.db "SELECT COUNT(*) as 'Total Hunts' FROM hunts"
          sqlite3 database/hunts.db "SELECT COUNT(DISTINCT tactic) as 'Unique Tactics' FROM hunts WHERE tactic IS NOT NULL"
          sqlite3 database/hunts.db "SELECT COUNT(DISTINCT technique) as 'Unique Techniques' FROM hunts WHERE technique IS NOT NULL"
