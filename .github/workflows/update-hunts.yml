name: Update Hunt Database

on:
  push:
    branches:
      - main
    paths:
      - "Flames/**.md"
      - "Embers/**.md"
      - "Alchemy/**.md"
  # Dispatched by assign-hunt-ids.yml. Its push uses GITHUB_TOKEN, which does
  # not trigger workflows, so a newly assigned hunt would never be indexed here.
  workflow_dispatch:

# Serialize runs of this workflow so two rebuilds never race each other on the
# same generated files. Don't cancel in-progress runs — each carries a real data
# commit we want to land.
concurrency:
  group: update-hunts-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3
        with:
          # Full history so rebuild_hunts_data.py can read each hunt's
          # original git creation date for the activity feed.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Rebuild hunt data and push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          GENERATED="hunts-data.js public/hunts-data.json public/actor-mentions.json"

          # These three files are DERIVED from the hunt markdown. On a push race the
          # correct resolution is to rebuild them on the new tip, never to merge or
          # rebase them — a generated commit conflicts on any byte that differs
          # between two runs, and git cannot know that regenerating is the answer.
          #
          # The previous version rebased instead, and it could not work: an earlier
          # actor-mentions.json carried a `generated_at` timestamp, so two rebuilds
          # ALWAYS differed on that line and the rebase ALWAYS conflicted. On
          # 2026-09-21 two PRs merged 13s apart, this job died on exactly that
          # conflict, and main kept a stale index while the run reported green under
          # a display name shared with .github/workflows/update-hunt-database.yml.
          # That timestamp is gone now; this loop covers the genuine case that
          # remains — two merges whose hunt content really does differ.
          for attempt in 1 2 3 4 5; do
            python3 scripts/rebuild_hunts_data.py

            if git diff --quiet -- $GENERATED; then
              echo "Generated files already match the hunt sources — nothing to commit."
              exit 0
            fi

            git add $GENERATED
            git commit -m "chore: Auto-update hunt database"

            if git push; then
              echo "Pushed regenerated hunt data on attempt $attempt."
              exit 0
            fi

            echo "Push failed (attempt $attempt): main moved. Discarding this build and regenerating on the new tip."
            git fetch origin main
            git reset --hard FETCH_HEAD
            sleep 2
          done
          echo "::error::Failed to push hunt data after 5 attempts"
          exit 1
